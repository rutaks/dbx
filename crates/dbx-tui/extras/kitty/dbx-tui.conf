# dbpane: release kitty's own Cmd shortcuts that the SQL editor uses, but only
# while dbpane is the program in the focused window.
#
# dbpane sets the kitty user variable `dbx_tui` when it starts and clears it
# when it exits (OSC 1337 SetUserVar), and `map --when-focus-on var:dbx_tui KEY`
# with no action hands KEY to the program while the variable is set. Elsewhere
# kitty keeps every one of these.
#
# Add to kitty.conf (run `dbpane kitty-setup` to print the path):
#     include /path/to/dbx-tui.conf
#
# Deliberately NOT released: cmd+v. With it unmapped kitty no longer pastes, and
# the program cannot read the clipboard, so paste would stop working. kitty's
# paste reaches dbpane as a bracketed paste, which is what it wants.
# cmd+r (replace) is not used yet, so kitty keeps it.

map --when-focus-on var:dbx_tui cmd+enter
map --when-focus-on var:dbx_tui cmd+f
map --when-focus-on var:dbx_tui cmd+l
map --when-focus-on var:dbx_tui cmd+g
map --when-focus-on var:dbx_tui cmd+shift+g
map --when-focus-on var:dbx_tui cmd+d
map --when-focus-on var:dbx_tui cmd+a
map --when-focus-on var:dbx_tui cmd+z
map --when-focus-on var:dbx_tui cmd+shift+z
map --when-focus-on var:dbx_tui cmd+x
map --when-focus-on var:dbx_tui cmd+c
map --when-focus-on var:dbx_tui cmd+backspace
map --when-focus-on var:dbx_tui cmd+left
map --when-focus-on var:dbx_tui cmd+right
map --when-focus-on var:dbx_tui cmd+up
map --when-focus-on var:dbx_tui cmd+down
map --when-focus-on var:dbx_tui cmd+home
map --when-focus-on var:dbx_tui cmd+end
map --when-focus-on var:dbx_tui cmd+/
map --when-focus-on var:dbx_tui cmd+alt+/
map --when-focus-on var:dbx_tui cmd+alt+enter
map --when-focus-on var:dbx_tui cmd+shift+up
map --when-focus-on var:dbx_tui cmd+shift+down
map --when-focus-on var:dbx_tui cmd+shift+left
map --when-focus-on var:dbx_tui cmd+shift+right
map --when-focus-on var:dbx_tui cmd+shift+home
map --when-focus-on var:dbx_tui cmd+shift+end
map --when-focus-on var:dbx_tui cmd+shift+u
map --when-focus-on var:dbx_tui cmd+shift+enter
map --when-focus-on var:dbx_tui cmd+f2
