[package]
name = "dbx-tui"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "A terminal database client, a head on dbx's core"

[lib]
name = "dbx_tui"
path = "src/lib.rs"

[[bin]]
name = "dbx-tui"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
ratatui = "0.30"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
