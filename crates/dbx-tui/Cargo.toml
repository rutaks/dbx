[package]
name = "dbx-tui"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
description = "A terminal database client, a head on dbx's core"

[lib]
name = "dbx_tui"
path = "src/lib.rs"

[[bin]]
name = "dbx-tui"
path = "src/main.rs"

[features]
# Test and fixture helpers on the production adapter (`DbxCore::seed_config`, ...).
# Never enabled in the client binary; tests get it through the self
# dev-dependency below.
test-support = []

[dependencies]
async-trait = "0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
# dbx's core. `sqlite-bundled` (never with a cipher feature) and `os-keyring`,
# which is required to open a store the desktop app created (spike, question 7).
dbx-core = { path = "../dbx-core", default-features = false, features = ["sqlite-bundled", "os-keyring"] }
futures = "0.3"
ratatui = "0.30"
# The SQL editor widget, confirmed with ratatui 0.30 in the prototype (design
# section 11). Wrapped by `app::editor::Editor`; its own renderer for now.
ratatui-textarea = "0.9"
# dbx's TLS needs a process-wide crypto provider installed at startup.
rustls = { version = "0.23", features = ["aws-lc-rs"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
# Single-line text fields: grapheme clusters for the cursor, display widths for
# scrolling and clicks. Both are already in the workspace lock.
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
dbx-tui = { path = ".", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

# Layer 1: DbxCore against scratch stores. Process-wide key variables, so these
# run in their own binary, serially (see README.md).
[[test]]
name = "store"
path = "tests/store.rs"

[[example]]
name = "seed_store"
required-features = ["test-support"]

# Layer 1 against the Docker fixtures (tests/fixtures/up.sh), also serial.
[[test]]
name = "live"
path = "tests/live.rs"
